name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and static consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-locked dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Terraform reference check
        run: |
          python -m pip install python-hcl2==8.1.4
          python scripts/check_tf_refs.py infrastructure/terraform

  test:
    name: Tests, coverage and RAG evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-locked dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Unit, API, security and pgvector integration tests
        run: pytest --cov --cov-report=xml --cov-report=term -p no:cacheprovider
      - name: Offline RAG evaluation gate (retrieval quality, TLP and poisoning leaks)
        run: tirag eval --min-hit-rate 0.85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  sast-and-dependencies:
    name: SAST and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-locked dev dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Bandit (medium+ severity and confidence fail the build)
        run: bandit -r src -c pyproject.toml -ll -ii
      - name: pip-audit (known vulnerabilities in the locked runtime dependencies)
        run: pip-audit --require-hashes -r requirements.txt --strict

  secrets-and-iac:
    name: Secret scan and IaC / Dockerfile / workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: .venv,.venv-lock,.git
      - name: Checkov (Terraform, Dockerfile, GitHub Actions)
        uses: bridgecrewio/checkov-action@2f9fbe2d1e51440f8f5c42abc829aad8e9e4faab # v12.3127.0
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          skip_download: true
          download_external_modules: false
          quiet: true
          compact: true
          soft_fail: false

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff infrastructure/terraform
      - name: validate (root stack)
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate (bootstrap stack)
        working-directory: infrastructure/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  terraform-plan:
    name: Terraform plan (staging, read-only)
    # Runs only for same-repo PRs once the account has been bootstrapped (the variables exist).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    needs: [terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-plan-${{ github.run_id }}
      - name: Plan
        working-directory: infrastructure/terraform
        env:
          TFVARS_JSON: ${{ vars.TIRAG_PLAN_TFVARS_JSON }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          if [ -z "${TFVARS_JSON}" ]; then TFVARS_JSON='{}'; fi
          printf '%s' "${TFVARS_JSON}" | jq -e . > ci.auto.tfvars.json
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION_NAME}" \
            -backend-config="key=tirag/staging/terraform.tfstate"
          terraform plan -input=false -lock=false -no-color \
            -var-file=environments/staging.tfvars -var "image_tag=plan-only" \
            | tee plan.txt
          { echo '### Terraform plan (staging)'; echo '```'; tail -n 80 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Build, scan and smoke-test the image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: tirag:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fixable HIGH/CRITICAL vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tirag:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Run the container hardened (read-only rootfs, no capabilities) and probe it
        run: |
          docker run -d --name tirag --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 \
            -e TIRAG_ENV=dev -e TIRAG_AUTH_MODE=disabled -e TIRAG_STORE_BACKEND=memory \
            tirag:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(docker exec tirag id -u)" = "10001"
      - name: Container logs on failure
        if: failure()
        run: docker logs tirag || true
