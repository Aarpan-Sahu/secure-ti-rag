[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tirag"
version = "1.0.0"
description = "Secure retrieval-augmented generation over MISP and OpenCTI threat intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarpan Sahu" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "langchain-aws>=1.0",
  "langchain-anthropic>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "PyJWT[crypto]>=2.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pgserver>=0.1.4",
  "checkov>=3.2",
  "pip-tools>=7.4",
]

[project.scripts]
tirag = "tirag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "C4", "RUF"]
ignore = [
  "S101",  # asserts: used in tests; app code does not use them for control flow
  "E501",  # line length is handled by `ruff format` (long prompt/regex strings are intentional)
  "UP042", # str+Enum keeps JSON-friendly values and str() semantics
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "B011"]
"tools/**" = ["S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs an embedded PostgreSQL + pgvector (pgserver)",
  "security: adversarial / abuse-case tests",
  "slow: performance checks",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/tirag"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.setuptools.package-data]
tirag = ["fixtures/*.json"]
