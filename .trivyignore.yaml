# Trivy misconfiguration suppressions that inline #trivy:ignore comments cannot express
# (count-expanded resources are not matched by them). Keep each entry scoped to a path.
misconfigurations:
  - id: AVD-AWS-0102
    paths:
      - infrastructure/terraform/modules/network/main.tf
    statement: >-
      Intra-data-tier rules only (aws_network_acl_rule.data_in_internal / data_out_internal) so RDS
      Multi-AZ replication cannot be broken by the NACL; app-tier access is limited to port 5432.
  - id: AWS-0102
    paths:
      - infrastructure/terraform/modules/network/main.tf
    statement: Same as above (short-ID form).
